<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Prospecção{% endblock %} · Creapar</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body>
  {% if user %}
  <header class="topbar">
    <strong>Creapar · Prospecção</strong>
    <nav>
      <a href="/">Início</a>
      <a href="/numeros">Números</a>
      <a href="/agenda">Agenda</a>
      <a href="/vendedores">Vendedores</a>
      <a href="/servidores">Servidores</a>
    </nav>
    <form method="post" action="/logout">
      <span>{{ user.nome }}</span>
      <button type="submit" class="link">Sair</button>
    </form>
  </header>
  {% endif %}
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
