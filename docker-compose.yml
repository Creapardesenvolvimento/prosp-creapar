x-app: &app
  build: .
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://creapar:${POSTGRES_PASSWORD}@postgres:5432/creapar
    REDIS_URL: redis://redis:6379/0
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  api:
    <<: *app
    ports:
      - "8000:8000"

  worker:
    <<: *app
    command: celery -A app.celery_app worker --loglevel=info --concurrency=4

  beat:
    <<: *app
    command: celery -A app.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: creapar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: creapar
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creapar"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
